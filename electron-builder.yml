# electron-builder configuration for LightAudit (SAAS_PLAN.md Phase A)
#
# Target: macOS arm64 (primary dev machine), Windows x64, Linux x64
# The packaged app contains the Next.js standalone server + native deps.
#
# ASAR note: files inside app.asar cannot be fork()ed or dlopen()ed.
# The audit worker and all .node binaries MUST be in asarUnpack.
# See electron/paths.js for the resolution strategy.
#
# Signing: scaffolded but disabled/guarded — cert env vars are absent locally.
# CI (release.yml) sets CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID etc.

appId: io.lightaudit.app
productName: LightAudit
copyright: "Copyright © 2026 LightAudit"

# The app directory: Next standalone output + our electron/ main process files.
# electron-builder treats this as the root of what goes into the ASAR.
directories:
  output: dist
  buildResources: electron/icons

# What to include in the package
files:
  # Next.js standalone server and its bundled node_modules
  # Note: electron-builder skips nested node_modules/ by default.
  # We explicitly include the standalone node_modules via nodeModules config below.
  - ".next/standalone/**/*"
  # Electron main process files
  - "electron/**/*"
  # Drizzle migrations (already copied into standalone by prepare-package.mjs,
  # but also include at root level for safety)
  - "drizzle/**/*"
  # Exclude secrets and dev-only files — NEVER ship these
  - "!**/.env*"
  - "!**/.mcp.json"
  - "!**/*.map"
  - "!**/node_modules/.cache/**"
  - "!**/.next/cache/**"
  - "!**/node_modules/electron/**"
  - "!**/node_modules/electron-builder/**"
  - "!**/node_modules/@electron/rebuild/**"
  - "!**/.git/**"
  - "!**/scripts/alias-hooks.mjs"
  - "!**/scripts/audit-worker.ts"
  # Exclude nested .next/standalone/.next/node_modules (Turbopack shims are
  # copied to .next/standalone/node_modules/ by prepare-package.mjs instead)
  - "!.next/standalone/.next/node_modules/**"
  # NEVER package a stray electron-builder output dir that may have leaked into
  # the standalone tree (a prior pack run's dist/ — recursive app-in-app bloat).
  # prepare-package.mjs scrubs this too; this is the belt-and-suspenders guard.
  - "!.next/standalone/dist/**"
  - "!.next/standalone/.next/cache/**"
  # NEVER package the dev/test SQLite DB + report files. getDataDir() defaults to
  # `<cwd>/data`, so running the standalone server from inside .next/standalone
  # during local testing leaves a `data/` dir there. At runtime LH_DATA_DIR points
  # at the OS app-data dir (never the install dir), so this is pure dev cruft.
  # prepare-package.mjs scrubs it too; this is the belt-and-suspenders guard.
  - "!.next/standalone/data/**"
  # Repo-root LEAK guard (security review). `output: "standalone"` + the sibling
  # `cloud/` license-server workspace makes @vercel/nft trace the whole repo root
  # into .next/standalone/ (cloud/ source, src/, design docs, configs, lockfiles).
  # next.config.ts pins outputFileTracingRoot and prepare-package.mjs hard-SCRUBS
  # these (the AUTHORITATIVE defence — negation-glob dot-matching is unreliable).
  # These negations are the belt-and-suspenders third layer.
  - "!.next/standalone/cloud/**"      # license-server source — must never ship
  - "!.next/standalone/src/**"        # app TS source — compiled into .next/
  - "!.next/standalone/cache/**"
  # OUR design/licensing docs at the standalone root (NOT third-party
  # node_modules/**/*.md, which are inert package licenses/readmes the scrub keeps).
  - "!.next/standalone/*.md"          # SAAS_PLAN.md / PRD.md / CLAUDE.md / README
  - "!.next/standalone/**/*.tsbuildinfo"
  - "!.next/standalone/package-lock.json"
  - "!.next/standalone/tsconfig.json"
  - "!.next/standalone/next.config.ts"
  - "!.next/standalone/vitest.config.ts"
  - "!.next/standalone/eslint.config.mjs"
  - "!.next/standalone/drizzle.config.ts"
  - "!.next/standalone/postcss.config.mjs"
  - "!.next/standalone/components.json"
  - "!.next/standalone/skills-lock.json"
  - "!.next/standalone/electron-builder.yml"

# Files/dirs to unpack from the ASAR (must be fork()able, dlopen()able, or
# require process.chdir() into their directory).
# Patterns are matched against the paths within the app package root.
asarUnpack:
  # All native Node addons — cannot load from inside ASAR
  - "**/*.node"
  # The ENTIRE Next standalone output must be unpacked because:
  #   1. server.js does `process.chdir(__dirname)` — chdir into ASAR paths fails
  #   2. The audit worker script must be fork()able
  #   3. Lighthouse and chrome-launcher read asset files from their own directories
  #   4. better-sqlite3 native addon needs dlopen()
  # electron-builder asarUnpack matches paths relative to the app root.
  # The leading slash in ASAR paths is internal; glob must match without it.
  - "**"

# Native module rebuild — rebuilds better-sqlite3 (and any other native deps)
# against Electron's Node ABI. electron-builder runs this automatically.
# @electron/rebuild is installed as a devDependency.
npmRebuild: true

# afterPack hook: copies the Electron-ABI-rebuilt better-sqlite3 binary into
# the standalone server's node_modules (which otherwise has the plain Node build).
afterPack: "./electron/after-pack.js"

# macOS configuration
mac:
  category: public.app-category.developer-tools
  target:
    - target: dir
      arch:
        - arm64
  # Icon for the packaged app
  # icon: electron/icons/icon.icns
  #
  # Code signing (BLOCKED-ON-USER: requires Apple Developer ID cert)
  # Disabled locally — CI sets CSC_LINK and CSC_KEY_PASSWORD.
  # identity: null disables signing for unsigned local builds.
  identity: null
  #
  # Notarization (BLOCKED-ON-USER: requires Apple ID + app-specific password)
  # Uncomment and configure in CI when certs are available:
  # notarize:
  #   teamId: "${APPLE_TEAM_ID}"

# Windows configuration (BLOCKED-ON-USER: requires Windows code-signing cert)
win:
  target:
    - target: dir
      arch:
        - x64
  # icon: electron/icons/icon.ico
  # certificateFile: "${WIN_CSC_LINK}"
  # certificatePassword: "${WIN_CSC_KEY_PASSWORD}"

# Linux configuration
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  # icon: electron/icons/

# Auto-updater publish configuration (BLOCKED-ON-USER: requires GitHub token)
# Uncomment and configure when ready for a live release channel.
# publish:
#   provider: github
#   owner: mysleekdesigns
#   repo: lightaudit-releases
#   releaseType: draft

# electron-updater channel config (referenced by auto-updater in main.js)
# channel: latest

# Extra metadata
extraMetadata:
  main: electron/main.js
  version: "0.1.0"
